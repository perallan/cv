  <body>
    <div class="main">
        <div class="inner">
            <h1>CSS testing</h1>
            <h2>Pure css faq's</h2>
            <details class="modern-faq">
                <summary>Hvordan fungerer display transition i 2026?</summary>
                <div class="faq-content">
                    <p>Ved å bruke 'allow-discrete' kan vi nå animere elementer som endrer display-verdi, slik at de ikke forsvinner umiddelbart før uttoningen er ferdig.</p>
                </div>
            </details>

            <h2>CSS functions</h2>
            <div class="function-wrapper" data-colors="#4f46e5,#06b6d4,#f97316,#ef4444,#10b981,#f59e0b,#a78bfa,#ec4899">
              <button class="button">Get started -></button>
              <div class="btn-row">
                <!-- CSS-only color controls: hidden radios + labels -->
                <input class="color-input" type="radio" name="color" id="none" checked>
                <input class="color-input" type="radio" name="color" id="c1">
                <label for="c1" class="btn c1" aria-label="Farge 1" style="--btn-color:#4f46e5"></label>
                <input class="color-input" type="radio" name="color" id="c2">
                <label for="c2" class="btn c2" aria-label="Farge 2" style="--btn-color:#06b6d4"></label>
                <input class="color-input" type="radio" name="color" id="c3">
                <label for="c3" class="btn c3" aria-label="Farge 3" style="--btn-color:#f97316"></label>
                <input class="color-input" type="radio" name="color" id="c4">
                <label for="c4" class="btn c4" aria-label="Farge 4" style="--btn-color:#ef4444"></label>
                <input class="color-input" type="radio" name="color" id="c5">
                <label for="c5" class="btn c5" aria-label="Farge 5" style="--btn-color:#10b981"></label>
                <input class="color-input" type="radio" name="color" id="c6">
                <label for="c6" class="btn c6" aria-label="Farge 6" style="--btn-color:#f59e0b"></label>
                <input class="color-input" type="radio" name="color" id="c7">
                <label for="c7" class="btn c7" aria-label="Farge 7" style="--btn-color:#a78bfa"></label>
                <input class="color-input" type="radio" name="color" id="c8">
                <label for="c8" class="btn c8" aria-label="Farge 8" style="--btn-color:#ec4899"></label>
                <!-- optional clear label to reset to CSS default -->
                <label for="none" class="btn reset" aria-label="Nullstill" title="Nullstill">×</label>
              </div>
              </div>
            </div>

        </div>
    </div>
